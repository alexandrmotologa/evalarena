name: evalarena CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Build React 19 Arena Studio
        working-directory: web
        run: npm run build

      - name: Run Go Unit Tests
        run: go test -v -race ./...

      - name: Build Single-Binary Engine
        run: go build -o bin/evalarena ./cmd/evalarena

      - name: Run Sample Benchmark Tournament
        run: ./bin/evalarena run --config examples/evalarena.yaml --rounds 1

      - name: Verify CI/CD Quality Gate
        run: ./bin/evalarena check --config examples/evalarena.yaml --candidate gemini-2.0-flash --baseline gpt-4o --max-elo-drop 100.0

      - name: Generate Benchmark Markdown Report
        run: ./bin/evalarena report --config examples/evalarena.yaml --format markdown --output report.md
